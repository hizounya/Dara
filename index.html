<title>Dara in Tech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar over one centered column. Cards sit on a lavender ground.
   The recurring motif is a git commit graph (dots joined by a line), echoing the "commit" in the community's name. */
:root{
  --bg:#f7f3fd;--surface:#ffffff;--surface-2:#f1eafb;--fg:#26193d;--muted:#675a80;--line:#e1d7f2;
  --accent:#7a4bd1;--accent-strong:#5b30aa;--accent-soft:#e7dcfb;--on-accent:#ffffff;
  --ok:#17694a;--ok-soft:#dcf3e8;--bad:#b0233b;--bad-soft:#fbe1e6;
  --shadow:0 1px 2px rgba(58,28,108,.06),0 10px 28px rgba(58,28,108,.08);
  --head:#3d2a85;--grad:linear-gradient(90deg,#6a48d6 0%,#a67ae0 55%,#ee9fcd 100%);
  --band:linear-gradient(90deg,#c9b8ec,#f0bfda);--band-fg:#3b2a7a;--logo-bg:transparent;--circuit:#e49fcf;--circuit-2:#cfbff0;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150f27;--surface:#211838;--surface-2:#2a1f47;--fg:#f1ebfd;--muted:#aa9fc6;--line:#3b2e5e;
    --accent:#b595ff;--accent-strong:#cdb7ff;--accent-soft:#3c2d68;--on-accent:#1a1030;
    --ok:#72d6a8;--ok-soft:#173a2c;--bad:#ff93a6;--bad-soft:#3f1f29;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --head:#e6dcff;--grad:linear-gradient(90deg,#b595ff 0%,#cfa0f0 55%,#ffb3d8 100%);
    --band:linear-gradient(90deg,#33265c,#5b3366);--band-fg:#f1ebfd;--logo-bg:#ffffff;--circuit:#8a5499;--circuit-2:#4a3a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150f27;--surface:#211838;--surface-2:#2a1f47;--fg:#f1ebfd;--muted:#aa9fc6;--line:#3b2e5e;
  --accent:#b595ff;--accent-strong:#cdb7ff;--accent-soft:#3c2d68;--on-accent:#1a1030;
  --ok:#72d6a8;--ok-soft:#173a2c;--bad:#ff93a6;--bad-soft:#3f1f29;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --head:#e6dcff;--grad:linear-gradient(90deg,#b595ff 0%,#cfa0f0 55%,#ffb3d8 100%);
  --band:linear-gradient(90deg,#33265c,#5b3366);--band-fg:#f1ebfd;--logo-bg:#ffffff;--circuit:#8a5499;--circuit-2:#4a3a7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);color:var(--head);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4.6vw,2.8rem);line-height:1.08;font-weight:800}
h2{font-size:1.3rem;line-height:1.2;font-weight:700}
h3{font-size:1.05rem;line-height:1.25;font-weight:700}
p{margin:0}
a{color:var(--accent-strong)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:8px}
.ic{width:1em;height:1em;flex:none}
.muted{color:var(--muted)}
.sel{user-select:all;word-break:break-all}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);margin-right:auto}
.logo-img{height:34px;width:auto;display:block;background:var(--logo-bg);border-radius:10px;padding:2px 6px}
.brand-tag{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.demo-chip{font:500 .65rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-strong);padding:3px 8px;border-radius:99px}
.acct{display:flex;align-items:center;gap:10px}
.who{font-weight:600;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{order:3;width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;font-weight:600;color:var(--muted);white-space:nowrap;border-radius:0}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
@media (min-width:880px){
  .tabs{order:2;width:auto;flex:1;justify-content:center;margin-bottom:0}
  .top-in{padding-bottom:0}
  .brand{margin-right:0}
}

/* page */
.wrap{max-width:1040px;margin:0 auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.foot{margin:24px 0 0;background:var(--band);color:var(--band-fg);border-radius:28px 28px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-size:.86rem}
.foot-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px}
.foot a{color:inherit;font-weight:700;font-size:1rem}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.lede{font-size:1.05rem;color:var(--muted);max-width:60ch;margin-top:10px}
.lede b{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.88rem;color:var(--muted)}
.strip b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty h3{color:var(--fg)}
.hint{font-size:.8rem;color:var(--muted)}
.tip-list{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:700;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent-strong);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:8px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.span2{grid-column:1/-1}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:.86rem}
.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:96px;resize:vertical}
select.input{padding-right:8px}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.pool-box{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* chips */
.chips,.tgl-group,.sugg,.tags{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:var(--surface-2);line-height:1.5}
.chip.hit{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong);font-weight:600}
.chip.miss{background:transparent;border-style:dashed;color:var(--muted)}
.chip.add{cursor:pointer;background:transparent}
.chip.add:hover{background:var(--surface-2)}
.chip.more{border-style:none;background:none;color:var(--muted)}
.chip-x{background:none;border:0;padding:0;display:inline-flex;color:inherit;border-radius:50%}
.picker{display:flex;flex-direction:column;gap:8px}
.picker .chips:empty{display:none}
.tgl{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.86rem;color:var(--muted)}
.tgl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.badge{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.badge.warn{background:var(--bad-soft);color:var(--bad)}
.badge.you{background:var(--accent-soft);color:var(--accent-strong)}

/* match score */
.mscore{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:14px;min-width:96px;text-align:center}
.mscore strong{font:800 1.8rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.mscore span{font:500 .62rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.mscore .bar{width:100%}
.bar{height:6px;border-radius:99px;background:rgba(120,100,160,.28);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:99px}
.m-hi{background:var(--accent);color:var(--on-accent)}
.m-mid{background:var(--accent-soft);color:var(--accent-strong)}
.m-low{background:var(--surface-2);color:var(--fg)}
.m-min{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.mscore.sm{min-width:72px;padding:8px 10px}
.mscore.sm strong{font-size:1.25rem}

/* job + member cards */
.list{display:flex;flex-direction:column;gap:12px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow)}
.job:hover{border-color:var(--accent)}
.job-main{display:flex;flex-direction:column;gap:9px;min-width:0}
.job-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.job-title{background:none;border:0;padding:0;text-align:left;font:700 1.08rem/1.25 var(--f-display);letter-spacing:-.01em}
.co{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.job{grid-template-columns:minmax(0,1fr)}.job .mscore{flex-direction:row;justify-content:space-between;order:-1}.job .mscore .bar{flex:1}}
.person{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font:700 .9rem var(--f-display)}
.person-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.person-main b{font-size:1rem}
.contact{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
@media (max-width:560px){.person{grid-template-columns:auto minmax(0,1fr)}.person .mscore{grid-column:1/-1;flex-direction:row;justify-content:space-between}.person .mscore .bar{flex:1}}

/* filters */
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.filters .search{grid-column:1/-1;position:relative}
.filters .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filters .search .input{padding-left:34px}
.range{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem}
.range input{accent-color:var(--accent);width:100%}
@media (max-width:760px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.seg-b{background:none;border:0;padding:7px 16px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg-b[aria-selected="true"]{background:var(--surface);color:var(--accent-strong);box-shadow:0 1px 3px rgba(58,28,108,.15)}
.count{color:var(--muted);font-size:.86rem}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(24,12,44,.58);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{position:relative;width:100%;max-width:760px;background:var(--surface);color:var(--fg);border-radius:18px;padding:24px;box-shadow:0 24px 70px rgba(20,8,40,.45);display:flex;flex-direction:column;gap:20px;outline:none}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.modal-x:hover{background:var(--surface-2)}
.modal h2{padding-right:40px}
.detail-head{display:flex;flex-direction:column;gap:8px;padding-right:40px}
.panel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;background:var(--surface-2);border-radius:14px;padding:16px}
.panel .mscore{min-width:112px}
.bk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.bk-top{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.88rem}
.track{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 3px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.panel{grid-template-columns:minmax(0,1fr)}.panel .mscore{width:100%}}
.sub{display:flex;flex-direction:column;gap:8px}
.sub h3{font-size:.95rem}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.cand-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.86rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .68rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .btn{white-space:nowrap}

/* auth */
.auth{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;max-width:1040px;margin:0 auto;padding-block:48px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.auth{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:28px 40px}}
.auth-brand{margin-bottom:26px}
.auth-brand .logo-img{height:56px;padding:3px 8px}
.log{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.log li{position:relative;padding:0 0 22px 36px}
.log li:last-child{padding-bottom:0}
.log li::before{content:"";position:absolute;left:5px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.log li::after{content:"";position:absolute;left:10.5px;top:22px;bottom:-4px;width:2px;background:var(--line)}
.log li:last-child::after{display:none}
.log code{font:500 .7rem var(--f-mono);color:var(--accent-strong);letter-spacing:.06em}
.log b{display:block}
.log span{color:var(--muted);font-size:.9rem}
.login{display:flex;flex-direction:column;gap:16px}
.login h2{font-size:1.4rem}
.demo-note{background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:10px 12px;font-size:.84rem}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* brand art: Dala the elephant, gradient words, circuit lines */
.grad{color:var(--accent);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero-row>div{min-width:0}
.dala-hero{width:clamp(104px,20vw,184px);height:auto;flex:none;filter:drop-shadow(0 10px 14px rgba(80,50,150,.22))}
.dala-sm{width:104px;height:auto;filter:drop-shadow(0 6px 8px rgba(80,50,150,.2))}
.auth-side{display:flex;flex-direction:column;align-items:center}
.auth-side .dala{width:min(220px,58%);height:auto;margin-bottom:-30px;position:relative;z-index:1;filter:drop-shadow(0 12px 16px rgba(80,50,150,.25))}
.auth-side .card{width:100%}
.circuit{position:absolute;top:14px;right:0;width:min(240px,38vw);height:auto;pointer-events:none}
.circuit .c{stroke:var(--circuit);stroke-width:2}
.circuit .l{stroke:var(--circuit-2);stroke-width:2}
@media (max-width:560px){.hero-row{align-items:flex-end}}

/* cv + mading */
.cv-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.cv-name{min-width:0;overflow-wrap:anywhere;font-weight:600}
.input[type="file"]{padding:8px 10px}
.post{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow)}
.post:hover{border-color:var(--accent)}
.post-desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.badge.kind{background:var(--accent-soft);color:var(--accent-strong)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.choice:hover{border-color:var(--accent);background:var(--surface-2)}
.choice span{color:var(--muted);font-size:.84rem}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}

/* toast */
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app"><p style="padding:40px 16px;text-align:center;color:var(--muted)">Loading Dara in Tech…</p></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= CONFIG =================
   Leave both Supabase values empty to run the demo (data stays in this browser).

/* ================= match engine ================= */
function levelIdx(v){return LEVELS.findIndex(l=>l.v===v)}
function levelScore(mv,jv){
  const a=levelIdx(mv),b=levelIdx(jv);if(a<0||b<0)return null;
  const d=a-b;
  if(d===0)return 1;
  if(d<0)return d===-1?0.5:d===-2?0.15:0;
  return d===1?0.75:d===2?0.4:0.15;
}
function sameCity(a,b){
  a=String(a||'').toLowerCase().trim();b=String(b||'').toLowerCase().trim();
  if(a.length<3||b.length<3)return false;
  return a.includes(b)||b.includes(a);
}
function matchScore(m,j){
  const ms=new Set((m.skills||[]).map(nk));
  const req=j.req_skills||[],nice=j.nice_skills||[];
  const reqHit=req.filter(s=>ms.has(nk(s))),reqMiss=req.filter(s=>!ms.has(nk(s)));
  const niceHit=nice.filter(s=>ms.has(nk(s))),niceMiss=nice.filter(s=>!ms.has(nk(s)));
  const parts=[];
  parts.push({key:'req',label:'Required skills',w:40,ok:req.length>0,s:req.length?reqHit.length/req.length:0,
    note:req.length?(reqHit.length+' of '+req.length+' required skills covered'):'The role lists no required skills'});
  parts.push({key:'nice',label:'Nice-to-have skills',w:10,ok:nice.length>0,s:nice.length?niceHit.length/nice.length:0,
    note:nice.length?(niceHit.length+' of '+nice.length+' extras covered'):'The role lists no extras'});
  const inField=(m.interests||[]).includes(j.category);
  parts.push({key:'field',label:'Field of interest',w:20,ok:true,s:inField?1:0,
    note:inField?(j.category+' is one of your fields'):(j.category+' is not one of your fields')});
  const ls=levelScore(m.level,j.level);
  parts.push({key:'level',label:'Experience level',w:15,ok:ls!==null,s:ls||0,
    note:ls===null?'Level not set':(ls===1?'Same level: '+lbl(LEVELS,j.level):('You: '+lbl(LEVELS,m.level)+'. Role: '+lbl(LEVELS,j.level)))});
  const modes=m.work_modes||[];
  let ws=0,wn='';
  if(j.work_mode==='remote'){
    ws=modes.includes('remote')?1:0.5;
    wn=modes.includes('remote')?'Remote fits your setup':'Remote role, not your preferred setup';
  }else{
    const modeOK=modes.includes(j.work_mode);
    const cityOK=!j.location||sameCity(m.city,j.location);
    ws=modeOK&&cityOK?1:modeOK?0.4:cityOK?0.2:0;
    wn=(modeOK?lbl(MODES,j.work_mode)+' fits your setup':lbl(MODES,j.work_mode)+' is not your preferred setup')+(j.location?(cityOK?', and the city matches':', but the city differs'):'');
  }
  parts.push({key:'setup',label:'Work setup and location',w:10,ok:modes.length>0,s:ws,note:wn});
  const types=m.job_types||[];
  const typeOK=types.includes(j.job_type);
  parts.push({key:'type',label:'Job type',w:5,ok:types.length>0,s:typeOK?1:0,
    note:typeOK?(lbl(JOB_TYPES,j.job_type)+' is on your list'):(lbl(JOB_TYPES,j.job_type)+' is not on your list')});
  let num=0,den=0;
  parts.forEach(p=>{if(p.ok){num+=p.s*p.w;den+=p.w}});
  const total=den?Math.max(0,Math.min(100,Math.round(100*num/den))):0;
  return {total,parts,reqHit,reqMiss,niceHit,niceMiss,reqN:req.length};
}
const band=p=>p>=80?'hi':p>=60?'mid':p>=35?'low':'min';
const bandLabel=p=>p>=80?'Strong match':p>=60?'Good match':p>=35?'Partial match':'Low match';
function completeness(m){
  const checks=[[!!m.headline,'Add a headline'],[!!m.city,'Add your city'],[(m.skills||[]).length>=4,'List at least 4 skills for sharper matches'],[(m.interests||[]).length>=1,'Pick a field of interest'],[(m.job_types||[]).length>=1,'Say what kind of role you want'],[(m.work_modes||[]).length>=1,'Choose your work setup'],[!!m.bio,'Write a short bio'],[!!m.linkedin,'Add your LinkedIn']];
  return {pct:Math.round(100*checks.filter(c=>c[0]).length/checks.length),tips:checks.filter(c=>!c[0]).map(c=>c[1])};
}

function demoPdf(m){
  const t=s=>String(s||'').replace(/[^\x20-\x7e]/g,'').replace(/[\\()]/g,'\\$&');
  const stream='BT /F1 20 Tf 72 740 Td ('+t(m.full_name||'Member')+') Tj /F1 12 Tf 0 -28 Td (Example CV, demo data only) Tj 0 -18 Td (Real members upload their own file here.) Tj ET';
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
  let out='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const x=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return new Blob([out],{type:'application/pdf'});
}

const SbAPI=(()=>{
  let sb=null;
  const must=r=>{if(r.error)throw new Error(r.error.message||'Something went wrong. Try again.');return r.data};
  const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the sign-in library. Check your connection.'));document.head.appendChild(s)});
  return {
   async init(){
     await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
     sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
   },
   async session(){const r=await sb.auth.getSession();const s=r.data&&r.data.session;return s?{id:s.user.id,email:s.user.email}:null},
   async sendCode(email){must(await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}))},
   async verify(email,code){
     const d=must(await sb.auth.verifyOtp({email,token:String(code).trim(),type:'email'}));
     const u=d.user||(d.session&&d.session.user);
     if(!u)throw new Error('Could not sign you in. Request a new code.');
     return {id:u.id,email:u.email};
   },
   async google(){must(await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}))},
   async signOut(){await sb.auth.signOut()},
   async isAdmin(u){const r=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();return !!r.data},
   async getMe(id){return must(await sb.from('members').select('*').eq('id',id).maybeSingle())},
   async saveMe(row){return must(await sb.from('members').upsert(row).select().single())},
   async deleteMe(id){must(await sb.from('members').delete().eq('id',id))},
   async deleteMember(id){must(await sb.from('members').delete().eq('id',id))},
   async listMembers(){return must(await sb.from('members').select('*').order('created_at',{ascending:false}))||[]},
   async listJobs(){return must(await sb.from('jobs').select('*').order('created_at',{ascending:false}))||[]},
   async saveJob(job){
     if(job.id){const id=job.id;const rest=Object.assign({},job);delete rest.id;must(await sb.from('jobs').update(rest).eq('id',id))}
     else must(await sb.from('jobs').insert(job));
   },
   async deleteJob(id){must(await sb.from('jobs').delete().eq('id',id))},
   async resetDemo(){},
   async listPosts(){return must(await sb.from('posts').select('*').order('created_at',{ascending:false}))||[]},
   async savePost(p){
     if(p.id){const id=p.id;const rest=Object.assign({},p);delete rest.id;must(await sb.from('posts').update(rest).eq('id',id))}
     else must(await sb.from('posts').insert(p));
   },
   async deletePost(id){must(await sb.from('posts').delete().eq('id',id))},
   async setPinned(id,v){must(await sb.from('posts').update({pinned:!!v}).eq('id',id))},
   async uploadCV(userId,file){
     const ext=fileExt(file.name);
     const path=userId+'/cv-'+Date.now()+'.'+ext;
     const r=await sb.storage.from('cvs').upload(path,file,{contentType:file.type||(ext==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'),upsert:false});
     if(r.error)throw new Error(r.error.message||'Could not upload the CV.');
     return {cv_path:path,cv_name:file.name,cv_size:file.size};
   },
   async removeCV(m){if(m&&m.cv_path&&m.cv_path!=='demo'){await sb.storage.from('cvs').remove([m.cv_path])}},
   async getCV(m){
     const r=await sb.storage.from('cvs').download(m.cv_path);
     if(r.error)throw new Error(r.error.message||'Could not download that CV.');
     return r.data;
   }
  };
})();

function pickerAdd(name,v){
  v=String(v).trim().replace(/\s+/g,' ').slice(0,40);if(!v)return;
  PK[name]=PK[name]||[];

  PK[name].push(v);pickerRefresh(name);
}

function sugForInterests(list){
  const cats=list&&list.length?list:CATEGORIES;
  const out=[];cats.forEach(c=>(SUG_BY_CAT[c]||[]).forEach(s=>{if(!out.some(x=>nk(x)===nk(s)))out.push(s)}));

function chipsFor(hit,miss,max){
  const all=hit.map(s=>({s,h:1})).concat(miss.map(s=>({s,h:0})));

  return shown.map(x=>x.h?'<span class="chip hit">'+ICON.check+esc(x.s)+'</span>':'<span class="chip miss">'+esc(x.s)+'</span>').join('')+(max&&all.length>max?'<span class="chip more">+'+(all.length-max)+' more</span>':'');
}

function filteredJobs(){

  try{
    const oldCv=S.me&&S.me.cv_path?S.me:null;
    let cv={cv_path:oldCv?oldCv.cv_path:null,cv_name:oldCv?oldCv.cv_name:null,cv_size:oldCv?oldCv.cv_size:null};
    let replaced=false;
    if(S.cvPending){cv=await API.uploadCV(S.user.id,S.cvPending);replaced=true}
    else if(S.cvRemove&&oldCv){await API.removeCV(oldCv);cv={cv_path:null,cv_name:null,cv_size:null}}
    cv.cv_shared=!!cv.cv_path&&row.in_pool&&cvShareVal();
    Object.assign(row,cv);
    const saved=await API.saveMe(row);
    if(replaced&&oldCv&&!DEMO)await API.removeCV(oldCv).catch(()=>{});
    S.me=Object.assign({},row,saved||{});
    S.cvPending=null;S.cvRemove=false;S.cvShare=null;
    await refreshData();
    if(onb){S.view='home';render();window.scrollTo(0,0);toast('Welcome to Dara in Tech')}
    else{render();toast('Profile saved')}
  }catch(e){btn.disabled=false;setErr(e.message)}
}
async function submitJob(form){
  flushPickers();
  const g=id=>{const e=$('#'+id,form);return e?e.value.trim():''};
  const p={title:g('j-title'),company:g('j-company'),category:g('j-cat'),level:g('j-level'),job_type:g('j-type'),work_mode:g('j-mode'),location:g('j-loc'),
    req_skills:(PK.req||[]).slice(),nice_skills:(PK.nice||[]).slice(),description:g('j-desc'),apply_link:g('j-link'),contact_email:g('j-mail'),deadline:g('j-deadline')||null};
  if(!p.title)return setErr('Enter the role title.');
  if(!p.company)return setErr('Enter the company name.');
  if(!p.req_skills.length)return setErr('Add at least one required skill. The match score depends on it.');
  if(p.contact_email&&!isEmail(p.contact_email))return setErr('Enter a valid contact email.');
  if(p.apply_link){const u=safeUrl(p.apply_link);if(!u)return setErr('That apply link does not look right.');p.apply_link=u}
  if(!p.apply_link&&!p.contact_email)return setErr('Add an apply link or a contact email so members can reach you.');
  const id=form.dataset.id;if(id)p.id=id;
  const btn=$('button[type=submit]',form);btn.disabled=true;
  try{
    await API.saveJob(p);await refreshData();closeModal();render();
    toast(id?'Role updated':'Role posted');
  }catch(e){btn.disabled=false;setErr(e.message)}
}
function csvCell(v){
  let s=Array.isArray(v)?v.join('; '):String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function csvText(){
  const cols=['full_name','email','city','status','headline','institution','level','skills','interests','job_types','work_modes','linkedin','cv_name','in_pool','created_at'];
  return '﻿'+[cols.join(',')].concat(S.members.map(m=>cols.map(c=>csvCell(m[c])).join(','))).join('\r\n');
}
async function saveFile(name,data){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});return}
  }catch(e){if(e&&e.code==='declined')return}
  const blob=data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='overlay'){if(e.target===t)closeModal();return}
  if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();
  try{
    switch(a){
      case 'nav':S.view=t.dataset.v;S.confirm=null;S.cvPending=null;S.cvRemove=false;S.cvShare=null;render();window.scrollTo(0,0);break;
      case 'tab':S.tab=t.dataset.v;render();break;
      case 'open-job':S.candMin=0;S.confirm=null;showJob(t.dataset.id,true);break;
      case 'close':closeModal();break;
      case 'post-job':PK.req=[];PK.nice=[];openModal(jobFormHTML());break;
      case 'edit-job':{const j=S.jobs.find(x=>x.id===t.dataset.id);if(j)setModal(jobFormHTML(j));break}
      case 'toggle-open':{const j=S.jobs.find(x=>x.id===t.dataset.id);if(j){await API.saveJob({id:j.id,is_open:j.is_open===false});await refreshData();showJob(j.id);render();toast(j.is_open===false?'Role reopened':'Role closed')}break}
      case 'del-job':S.confirm='j:'+t.dataset.id;showJob(t.dataset.id);break;
      case 'del-job-yes':await API.deleteJob(t.dataset.id);S.confirm=null;await refreshData();closeModal();render();toast('Role deleted');break;
      case 'cancel-confirm':{const c=S.confirm;S.confirm=null;if(c&&c.indexOf('j:')===0)showJob(c.slice(2));else if(c&&c.indexOf('p:')===0)showPost(c.slice(2));else render();break}
      case 'mad-filter':S.mad=t.dataset.v;render();break;
      case 'post-menu':openModal(postMenuHTML());break;
      case 'post-kind':if(t.dataset.v==='job'){PK.req=[];PK.nice=[];setModal(jobFormHTML())}else setModal(postFormHTML(t.dataset.v));break;
      case 'open-post':S.confirm=null;showPost(t.dataset.id,true);break;
      case 'edit-post':{const p=S.posts.find(x=>x.id===t.dataset.id);if(p)setModal(postFormHTML(p.kind,p));break}
      case 'del-post':S.confirm='p:'+t.dataset.id;showPost(t.dataset.id);break;
      case 'del-post-yes':await API.deletePost(t.dataset.id);S.confirm=null;await refreshData();closeModal();render();toast('Post deleted');break;
      case 'pin-post':{const p=S.posts.find(x=>x.id===t.dataset.id);if(p){await API.setPinned(p.id,!p.pinned);await refreshData();showPost(p.id);render();toast(p.pinned?'Unpinned':'Pinned to the top')}break}
      case 'cv-clear':{S.cvPending=null;const i=$('#f-cv');if(i)i.value='';$('#cv-box').innerHTML=cvBoxHTML();break}
      case 'cv-remove':S.cvRemove=true;$('#cv-box').innerHTML=cvBoxHTML();break;
      case 'dl-cv':{const m=S.members.find(x=>x.id===t.dataset.id)||(S.me&&S.me.id===t.dataset.id?S.me:null);if(!m||!m.cv_path)break;toast('Preparing CV…');const blob=await API.getCV(m);await saveFile(m.cv_name||'cv.pdf',blob);break}
      case 'pk-add':pickerAdd(t.dataset.pk,t.dataset.v);break;
      case 'pk-del':PK[t.dataset.pk].splice(+t.dataset.i,1);pickerRefresh(t.dataset.pk);break;
      case 'tg':{
        const n=t.dataset.tg,v=t.dataset.v;TG[n]=TG[n]||[];
        const i=TG[n].indexOf(v);if(i>=0)TG[n].splice(i,1);else TG[n].push(v);
        t.setAttribute('aria-pressed',String(i<0));
        if(n==='interests'&&PKS.skills){PKS.skills=sugForInterests(TG.interests);pickerRefresh('skills')}
        break}
      case 'clear-filters':S.f={q:'',cat:'',mode:'',type:'',min:0,sort:'match',open:true};render();break;
      case 'copy':try{await navigator.clipboard.writeText(t.dataset.v);toast('Copied')}catch(err){toast('Select the text to copy it')}break;
      case 'signout':await API.signOut();Object.assign(S,{user:null,admin:false,me:null,view:'home',authStep:'email',authErr:'',busy:false,confirm:null,cvPending:null,cvRemove:false,cvShare:null,mad:'all'});closeModal();render();break;
      case 'google':try{await API.google()}catch(err){S.authErr=err.message;render()}break;
      case 'back-email':S.authStep='email';S.authErr='';render();break;
      case 'export-csv':await saveFile('dara-in-tech-participants.csv',csvText());break;
      case 'member-del':S.confirm='m:'+t.dataset.id;$('#admin-table').innerHTML=adminTableHTML();break;
      case 'member-del-yes':{const mm=S.members.find(x=>x.id===t.dataset.id);if(mm&&mm.cv_path)await API.removeCV(mm).catch(()=>{})}await API.deleteMember(t.dataset.id);S.confirm=null;await refreshData();render();toast('Participant removed');break;
      case 'reset-demo':await API.resetDemo();await refreshData();S.me=await API.getMe(S.user.id);render();toast('Demo data reset');break;
      case 'del-me':S.confirm='me';render();break;
      case 'del-me-yes':if(S.me&&S.me.cv_path)await API.removeCV(S.me).catch(()=>{});await API.deleteMe(S.user.id);S.me=null;S.confirm=null;await refreshData();render();window.scrollTo(0,0);toast('Profile deleted');break;
    }
  }catch(err){toast(err&&err.message?err.message:'Something went wrong. Try again.')}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();
  const k=f.dataset.form;
  if(k==='profile')return submitProfile(f);
  if(k==='job')return submitJob(f);
  if(k==='post')return submitPost(f);
  if(k==='auth-email'){
    const email=($('#a-email',f).value||'').trim().toLowerCase();
    S.authEmail=email;
    if(!isEmail(email)){S.authErr='Enter a valid email address.';return render()}
    S.busy=true;S.authErr='';render();
    try{await API.sendCode(email);S.authStep='code'}catch(err){S.authErr=err.message}
    S.busy=false;render();
  }
  if(k==='auth-code'){
    const code=($('#a-code',f).value||'').trim();
    if(!code){S.authErr='Enter the code from your email.';return render()}
    S.busy=true;S.authErr='';render();
    try{const u=await API.verify(S.authEmail,code);await afterLogin(u)}catch(err){S.busy=false;S.authErr=err.message||'That code did not work. Request a new one.';render()}
  }
});
function onInput(e){
  const t=e.target;
  if(t.dataset&&t.dataset.f!==undefined){
    const k=t.dataset.f;let v=t.type==='checkbox'?t.checked:t.value;
    if(k==='min'){v=+v;const mv=$('#minv');if(mv)mv.textContent=v+'%'}
    S.f[k]=v;const r=$('#results');if(r)r.innerHTML=rolesResultsHTML();
  }else if(t.dataset&&t.dataset.mf!==undefined){
    S.mf[t.dataset.mf]=t.value;const r=$('#members-results');if(r)r.innerHTML=membersResultsHTML();
  }else if(t.dataset&&t.dataset.aq!==undefined){
    S.aq=t.value;const r=$('#admin-table');if(r)r.innerHTML=adminTableHTML();
  }else if(t.id==='cand-min'){
    S.candMin=+t.value;const j=S.jobs.find(x=>x.id===S.openJob);
    const l=$('#cand-list');if(l&&j)l.innerHTML=candListHTML(j);
  }else if(t.id==='j-cat'){
    const s=SUG_BY_CAT[t.value]||[];PKS.req=s;PKS.nice=s;pickerRefresh('req');pickerRefresh('nice');
  }else if(t.id==='f-cv'){
    const f=t.files&&t.files[0];if(!f)return;
    if(!CV_EXT.includes(fileExt(f.name))){toast('Choose a PDF or DOCX file.');t.value='';return}
    if(f.size>CV_MAX){toast('That file is over 2 MB. Choose a smaller one.');t.value='';return}
    S.cvPending=f;S.cvRemove=false;$('#cv-box').innerHTML=cvBoxHTML();
  }else if(t.id==='f-cvshare'){
    S.cvShare=t.checked;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root .modal')){closeModal();return}
  const t=e.target;
  if(t&&t.id&&t.id.indexOf('pk-')===0){
    const n=t.id.slice(3);
    if(e.key==='Enter'||e.key===','){e.preventDefault();pickerAdd(n,t.value);t.value=''}
    else if(e.key==='Backspace'&&!t.value&&PK[n]&&PK[n].length){PK[n].pop();pickerRefresh(n)}
  }
});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!S.user||!S.me)return;
  if($('#modal-root .modal')||S.view==='profile')return;
  try{await refreshData();render()}catch(e){}
});

/* ================= boot ================= */
async function boot(){
  try{
    await API.init();
    const u=await API.session();
    if(u){await afterLogin(u)}else{S.ready=true;render()}
  }catch(e){
    $('#app').innerHTML='<div class="auth"><section class="card"><h2>Could not start</h2><p class="muted" style="margin-top:8px">'+esc(e.message||'Unknown error')+'</p></section></div>';
  }
}
if(window.__DARA_TEST)window.__DARA_TEST={matchScore,nk,seedDemo,csvText,S};
boot();
})();
